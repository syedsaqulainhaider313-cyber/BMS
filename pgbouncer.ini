[databases]
bms = host=postgres port=5432 dbname=bms auth_user=bms

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = bms
stats_users = bms

# Pooling Mode: Transaction mode decouples client sessions from backend connections
pool_mode = transaction
server_reset_query = DISCARD ALL

# Connection Limits (default_pool_size = 50, max_client_conn = 500)
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_client_conn = 500
max_db_connections = 60

# Timeouts (seconds)
server_idle_timeout = 600
client_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 120

# Low-level TCP Keepalive
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 5
