[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-backend"
version = "0.1.0"
description = "Internal permission-based campaign operations API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "nh3>=0.2,<1.3",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
